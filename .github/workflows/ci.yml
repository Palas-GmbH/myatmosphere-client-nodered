name: Validate Node-RED package

on:
  pull_request:
    paths:
      - "src/node-red-myatmosphere/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "tests/**"
      - "test.ps1"
  push:
    branches: [main]
    paths:
      - "src/node-red-myatmosphere/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "tests/**"
      - "test.ps1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src/node-red-myatmosphere
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/node-red-myatmosphere/package-lock.json

      - name: Select repository npm
        run: npm install --global npm@12.2.1 --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci

      - name: Run package smoke
        id: repository-tests
        shell: pwsh
        working-directory: .
        run: ./test.ps1 ci
      - name: Retain test logs and receipts
        if: always() && steps.repository-tests.outcome != '' && steps.repository-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/tests/*/console.log
            .artifacts/tests/*/result.json
          include-hidden-files: true
          if-no-files-found: ${{ job.status == 'cancelled' && 'warn' || 'error' }}
          retention-days: 7
